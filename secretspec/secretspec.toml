# SecretSpec manifest template for this nix-config repo.
# Operators fill in real values on their own host after key enrollment.
# The `age` provider is intentionally NOT aliased here because the pinned
# nixpkgs carries secretspec 0.13.0 (the `age` provider lands in 0.17+,
# unreleased as of 2026-07-24).
[project]
name = "nix-config"
revision = "1.0"

[providers]
host_keyring = "keyring://"
local_env     = "env://"
local_dotenv  = "dotenv://"

[profiles.default]
# Example placeholder. Replace with a real entry when an app adopts
# the SecretSpec SDK or the `secretspec run` wrapper.
EXAMPLE_TOKEN = { description = "Placeholder", required = false }

# Coding agent API keys — delivered via `sops exec-env`, not secretspec providers.
OPENAI_API_KEY     = { description = "OpenAI API key (delivered via sops exec-env)", required = false }
ANTHROPIC_API_KEY  = { description = "Anthropic API key (delivered via sops exec-env)", required = false }
GEMINI_API_KEY     = { description = "Gemini API key (delivered via sops exec-env)", required = false }
OPENROUTER_API_KEY = { description = "OpenRouter API key (delivered via sops exec-env)", required = false }
GITHUB_TOKEN       = { description = "GitHub token (delivered via sops exec-env)", required = false }
